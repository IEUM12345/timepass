<style>

<script>
/* ---------- data ---------- */
const SCAN=447, EXP_ENTRY=465, BOARD0=510;
const GATES={23:{name:'23번',pos:10},31:{name:'31번',pos:14}};
const CAT={
  food:{label:'식당',verb:'식사',min:18,typ:25,qmin:10,qtyp:12,sub:true,desc:'보통 20~30분'},
  cafe:{label:'카페',verb:'커피·디저트',min:8,typ:12,qmin:3,qtyp:5,desc:'보통 5~15분'},
  shop:{label:'면세점',verb:'쇼핑',min:10,typ:15,sub:true,desc:'보통 10~20분'},
  rest:{label:'라운지·쉬기',verb:'휴식',min:15,typ:30,desc:'보통 20분 이상'}
};
const SUBS={
  food:['한식','중식','일식','양식','아무거나 빠르게'],
  shop:['화장품·향수','주류','담배','의류·잡화','기념품·식품']
};
const P=[
 {id:'r1',cat:'food',sub:'한식',name:'식당 A',pos:3,wait:4,tags:['비빔밥·국밥'],to:true},
 {id:'r2',cat:'food',sub:'한식',name:'식당 E',pos:-3,wait:2,tags:['정식','한산한 편']},
 {id:'r3',cat:'food',sub:'한식',name:'식당 H',pos:7,wait:7,tags:['분식','포장 가능'],to:true},
 {id:'r4',cat:'food',sub:'중식',name:'식당 D',pos:6,wait:5,tags:['면·밥'],to:true},
 {id:'r5',cat:'food',sub:'중식',name:'식당 I',pos:-1,wait:3,tags:['딤섬']},
 {id:'r6',cat:'food',sub:'일식',name:'식당 B',pos:5,wait:6,tags:['우동·덮밥'],to:true},
 {id:'r7',cat:'food',sub:'일식',name:'식당 F',pos:8,wait:8,tags:['초밥']},
 {id:'r8',cat:'food',sub:'일식',name:'식당 J',pos:2,wait:3,tags:['라멘']},
 {id:'r9',cat:'food',sub:'양식',name:'식당 C',pos:2,wait:3,tags:['버거','포장 가능'],to:true},
 {id:'r10',cat:'food',sub:'양식',name:'식당 G',pos:6,wait:4,tags:['파스타']},
 {id:'r11',cat:'food',sub:'양식',name:'식당 K',pos:9,wait:2,tags:['샌드위치','포장 가능'],to:true},
 {id:'c1',cat:'cafe',name:'카페 A',pos:3,wait:2,tags:['간단한 빵'],to:true},
 {id:'c2',cat:'cafe',name:'카페 B',pos:4,wait:6,tags:['디저트'],to:true},
 {id:'c3',cat:'cafe',name:'카페 C',pos:-4,wait:3,tags:['조용한 편']},
 {id:'c4',cat:'cafe',name:'카페 D',pos:8,wait:2,tags:['탑승구 근처'],to:true},
 {id:'c5',cat:'cafe',name:'카페 E',pos:12,wait:1,tags:['31번 근처'],to:true},
 {id:'d1',cat:'shop',sub:'화장품·향수',name:'면세점 A',pos:2,wait:2,tags:['화장품 전문']},
 {id:'d2',cat:'shop',sub:'화장품·향수',name:'면세점 B',pos:6,wait:3,tags:['향수 강함']},
 {id:'d3',cat:'shop',sub:'화장품·향수',name:'면세점 C',pos:-2,wait:1,tags:['한산한 편']},
 {id:'d4',cat:'shop',sub:'주류',name:'주류 매장 A',pos:5,wait:2,tags:['위스키·와인']},
 {id:'d5',cat:'shop',sub:'주류',name:'주류 매장 B',pos:-3,wait:1,tags:['전통주']},
 {id:'d6',cat:'shop',sub:'담배',name:'담배 매장 A',pos:4,wait:1,tags:['빠른 계산']},
 {id:'d7',cat:'shop',sub:'담배',name:'담배 매장 B',pos:9,wait:2,tags:['탑승구 근처']},
 {id:'d8',cat:'shop',sub:'의류·잡화',name:'잡화 매장 A',pos:3,wait:1,tags:['가방·지갑']},
 {id:'d9',cat:'shop',sub:'의류·잡화',name:'잡화 매장 B',pos:7,wait:1,tags:['선글라스·시계']},
 {id:'d10',cat:'shop',sub:'기념품·식품',name:'기념품 매장 A',pos:1,wait:2,tags:['김·홍삼']},
 {id:'d11',cat:'shop',sub:'기념품·식품',name:'기념품 매장 B',pos:6,wait:1,tags:['한국 과자']},
 {id:'l1',cat:'rest',name:'라운지 A',pos:5,wait:2,tags:['유료·카드 혜택','샤워']},
 {id:'l2',cat:'rest',name:'휴식 공간 B',pos:9,wait:0,tags:['무료','탑승구 근처'],to:true},
 {id:'l3',cat:'rest',name:'라운지 C',pos:-3,wait:3,tags:['유료','조용한 편']}
];
const byId=id=>P.find(p=>p.id===id);

/* ---------- state ---------- */
const S={scr:'wait',hist:[],picks:[],subs:{},chosen:{},quick:{},page:{},step:0,entered:null,fav:'cam',
  scen:{delay:false,gate:false,late:false}};
const board=()=>BOARD0+(S.scen.delay?20:0);
const gate=()=>GATES[S.scen.gate?31:23];
const expEntry=()=>S.scen.late?475:EXP_ENTRY;
const entryT=()=>S.entered!=null?S.entered:expEntry();
const hm=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,mm=((m%60)+60)%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')};
const fl5=m=>Math.max(0,Math.floor(m/5)*5);
const minOf=(cat,q)=>q&&CAT[cat].qmin?CAT[cat].qmin:CAT[cat].min;
const typOf=(cat,q)=>q&&CAT[cat].qtyp?CAT[cat].qtyp:CAT[cat].typ;
const baseDepart=()=>board()-gate().pos;
const baseFree=()=>baseDepart()-entryT();

/* stops in pick order; unchosen picks become placeholders that reserve time */
function stops(override){
  return S.picks.map((cat,i)=>{
    const id=override&&override.cat===cat?override.id:S.chosen[cat];
    const q=!!S.quick[cat];
    if(id){const p=byId(id);return {cat,q,p,pos:p.pos,wait:p.wait,ph:false}}
    const prev=i>0?S.picks[i-1]:null; const pp=prev&&S.chosen[prev]?byId(S.chosen[prev]).pos:Math.min(4,gate().pos);
    return {cat,q,p:null,pos:pp,wait:3,ph:true};
  });
}
function plan(st){
  let t=entryT(),pos=0,fixed=0;const segs=[];
  st.forEach((s,i)=>{const w=Math.abs(s.pos-pos)+(i>0?1:0);s.walk=w;fixed+=w+s.wait;pos=s.pos});
  const wg=Math.abs(gate().pos-pos)+(st.length?1:0);fixed+=wg;
  const avail=board()-t-fixed;
  const mins=st.map(s=>minOf(s.cat,s.q)),typs=st.map(s=>typOf(s.cat,s.q));
  const minSum=mins.reduce((a,b)=>a+b,0),typSum=typs.reduce((a,b)=>a+b,0)||1;
  const feasible=avail>=minSum;const extra=Math.max(0,avail-minSum);
  const items=st.map((s,i)=>{
    const stay=feasible?mins[i]+extra*typs[i]/typSum:Math.max(0,mins[i]*avail/Math.max(minSum,1));
    t+=s.walk;const arrive=t;t+=s.wait;t+=stay;
    segs.push({k:'walk',v:s.walk},{k:'wait',v:s.wait},{k:'stay',v:stay,cat:s.cat});
    return {...s,arrive,stay,leave:t,min:mins[i]};
  });
  segs.push({k:'walk',v:wg});
  const depart=st.length?board()-wg:baseDepart();
  if(!st.length)segs.unshift({k:'free',v:Math.max(0,depart-entryT())},);
  return {items,depart,wg,feasible,avail,minSum,extra,segs,start:entryT()};
}
function reco(cat){
  const sub=S.subs[cat];
  let c=P.filter(p=>p.cat===cat&&(!sub||sub==='아무거나 빠르게'||p.sub===sub));
  if(sub==='아무거나 빠르게')c=c.filter(p=>p.wait<=4);
  const g=gate().pos;
  const r=c.map(p=>{const pl=plan(stops({cat,id:p.id}));const it=pl.items[S.picks.indexOf(cat)];
    const onRoute=p.pos>=0&&p.pos<=g;return {p,it,pl,ok:pl.feasible&&it.stay>=it.min,onRoute,toGate:Math.abs(g-p.pos)}});
  r.sort((a,b)=>(b.ok-a.ok)||(b.onRoute-a.onRoute)||(b.it.stay-a.it.stay));
  return r;
}
function estimate(picks){
  const n=picks.length;if(!n)return null;
  const typ=picks.reduce((a,c)=>a+CAT[c].typ,0)+n*5;
  const min=picks.reduce((a,c)=>a+(CAT[c].qmin||CAT[c].min),0)+n*5;
  const f=baseFree();
  if(typ<=f)return {k:'ok',t:'여유 있어요',d:`보통 걸리는 시간을 다 써도 ${f-typ}분쯤 남아요.`};
  if(min<=f)return {k:'tight',t:'빠듯하지만 가능해요',d:`${picks.includes('food')?'식사는 간단히, ':''}${picks.includes('cafe')?'카페는 포장으로 ':''}하면 ${f}분 안에 모두 들를 수 있어요.`.replace(/, $/,'')};
  return {k:'over',t:'시간이 모자라요',d:`가장 짧게 해도 약 ${min}분이 필요해요. 하나를 빼는 걸 추천해요.`};
}

 <div class="spacer"></div><button class="btn" data-go="plan">알림 받기 (시연)</button>`;
V.enter=()=>V.plan(false).replace(/<div class="sticky">[\s\S]*<\/div>$/,'')+`
 <div class="sheet-bg"><div class="sheet"><span class="pill">🕒 ${hm(expEntry())} · 출국심사 통과 예상 시각</span>
  <h2 style="font-size:25px">들어오셨나요?</h2>
  <div class="tag" style="font-size:14px">누르신 시각부터 다시 계산해 드려요. 누르지 않으면 예상 시각대로 안내할게요.</div>
  <button class="btn" data-entered="1">들어왔어요</button><button class="btn ghost" data-go="still">아직이에요</button></div></div>`;
V.still=()=>`
 <div class="hero"><small>아직 줄에 계신가요? 최신 대기로 다시 잡았어요</small>
  <div class="big num"><span>약</span>6<span>분</span></div><hr>
  <div class="row"><span>출국심사 통과 예상</span><b class="num" style="font-size:24px">${hm(expEntry()+8)}</b></div></div>
 <div class="panel">고르신 곳은 그대로 두고, 들어오신 시각에 머무는 시간을 다시 나눠요. 빠듯해지면 포장으로 바꾸거나 하나를 빼자고 먼저 알려 드려요.</div>
 <div class="spacer"></div><button class="btn" data-entered="8">들어왔어요</button>`;
V.confirm=()=>V.plan(true);
V.alerts=()=>{const pl=plan(stops());const n=[];
  pl.items.forEach((it,i)=>{const nx=pl.items[i+1];
    n.push(`<div class="noti"><small>${hm(it.leave-5)} · 알림톡</small>5분 뒤 ${it.p.name}에서 나오실 시간이에요.</div>`);
    n.push(`<div class="noti"><small>${hm(it.leave)} · 알림톡</small>${it.p.name}에서 나오실 시간이에요 · ${nx?`다음 ${nx.p.name}까지 도보 ${nx.walk}분`:`${gate().name} 탑승구까지 도보 ${pl.wg}분`}</div>`)});
  return band()+`<h2>머무는 동안 이렇게 알려 드려요</h2>${n.join('')}
  ${S.scen.delay?`<div class="noti alert"><small>변경 · 출발 지연</small><b>출발이 20분 늦어졌어요. 머무는 시간을 다시 나눴어요.</b> 탑승구로는 ${hm(pl.depart)}까지 출발하시면 돼요.</div>`:''}
  ${S.scen.gate?`<div class="noti alert"><small>변경 · 탑승구</small><b>탑승구가 31번으로 바뀌었어요.</b> 걷는 거리가 늘어 ${hm(pl.depart)}까지 출발하셔야 해요.</div>`:''}
  ${!S.scen.delay&&!S.scen.gate?`<div class="note">아래 ‘시연 상황 바꿔 보기’에서 지연이나 탑승구 변경을 켜 보세요. 방송은 “지연”까지만 알려 주지만, 타임패스는 그래서 몇 시까지 머물러도 되는지 다시 계산해 알려 드려요.</div>`:''}
  <div class="spacer"></div><button class="btn" data-go="go">출발 시각 화면 보기 ›</button>`};
V.go=()=>{const pl=plan(stops());const wg=S.picks.length?pl.wg:gate().pos;
  return `<div class="end"><span class="num" style="opacity:.85">${hm(pl.depart-5)} 알림</span>
  <h1>지금 탑승구로<br>출발하세요</h1>
  <div class="kv"><div><small>탑승구</small><b class="num">${gate().name}</b></div><div><small>도보</small><b class="num">${wg}분</b></div></div>
  <div style="font-size:14px">탑승 시작 ${hm(board())} · ${hm(pl.depart+wg)} 도착 예정 · 마감 ${hm(board()+20)}</div>
  <div class="spacer"></div><button class="btn">길 보기 ›</button>
  <div style="background:var(--surface);color:var(--ink);border-radius:14px;padding:14px;font-size:14px">다음 출국엔 <b>스마트패스</b>로 줄을 더 짧게 ›</div>
  <div style="font-size:12px;opacity:.85;text-align:center">참고 안내이며, 탑승은 항공사 안내와 탑승 방송이 우선합니다.</div>
  <button class="link" style="color:#fff" data-reset="1">처음부터 다시 보기</button></div>`};

/* ---------- render ---------- */
const phone=document.getElementById('phone');
function render(){
  const k=S.scr==='confirm'?'confirm':S.scr;
  const st=k==='confirm'?1:(stageOf[k]??0);
  phone.innerHTML=`<div class="top"><span style="display:flex;align-items:center">${S.hist.length?'<button class="back" data-back="1" aria-label="뒤로">‹</button>':''}<span class="logo">TIMEPASS</span></span><span class="lang">🌐 한국어 · EN · 中文 · 日本語</span></div>
   <div class="steps"><div class="bar" style="width:calc((100% - 54px) * ${st/2})"></div>${['대기 줄','면세구역','탑승구'].map((n,i)=>`<div class="step ${i===st?'on':i<st?'done':''}"><span class="dot"></span>${n}</div>`).join('')}</div>
   <div class="screen">${V[k]()}</div>`;
  document.getElementById('scen').innerHTML=[['delay','출발 20분 지연'],['gate','탑승구 31번으로 변경'],['late','출국심사 늦어짐 (+10분)']].map(([k,l])=>`<button class="${S.scen[k]?'on':''}" data-scen="${k}" aria-pressed="${S.scen[k]}">${l}</button>`).join('');
  document.getElementById('jump').innerHTML=[['wait','남은 대기'],['free','할 일 고르기'],['plan','내 동선'],['confirm','들어온 뒤'],['alerts','알림'],['go','출발']].map(([k,l])=>`<button class="${S.scr===k?'on':''}" data-jump="${k}">${l}</button>`).join('')+`<button data-reset="1">처음부터</button>`;
}
function go(s,push=true){if(push&&S.scr!==s)S.hist.push(S.scr);S.scr=s;render();window.scrollTo({top:0})}
function nextStep(){
  const i=S.picks.findIndex(c=>!S.chosen[c]);
  if(i<0){go(S.entered!=null?'confirm':'plan');return}
  S.step=i;const c=S.picks[i];go(CAT[c].sub&&!S.subs[c]?'sub':'reco');
}
function ensureDemo(){ if(!S.picks.length){S.picks=['food','cafe'];S.subs.food='한식'} S.picks.forEach(c=>{if(!S.chosen[c]){const r=reco(c).find(o=>o.ok)||reco(c)[0];if(r)S.chosen[c]=r.p.id}})}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.back){S.scr=S.hist.pop()||'wait';render();return}
  if(d.fav){S.fav=d.fav;render();return}
  if(d.toggle){const c=d.toggle,i=S.picks.indexOf(c);if(i>=0){S.picks.splice(i,1);delete S.chosen[c]}else S.picks.push(c);render();return}
  if(d.startpicks){nextStep();return}
  if(d.sub){const c=S.picks[S.step];S.subs[c]=d.sub;S.page[c]=0;if(d.sub==='아무거나 빠르게'&&CAT[c].qmin)S.quick[c]=true;go('reco');return}
  if(d.q!==undefined){const c=S.picks[S.step];S.quick[c]=d.q==='1';render();return}
  if(d.more){const c=d.more,n=Math.ceil(reco(c).length/3);S.page[c]=((S.page[c]||0)+1)%n;render();return}
  if(d.choose){const p=byId(d.choose);S.chosen[p.cat]=p.id;nextStep();return}
  if(d.quick){S.quick[d.quick]=true;render();return}
  if(d.swap){const c=d.swap;delete S.chosen[c];S.step=S.picks.indexOf(c);S.page[c]=0;go(CAT[c].sub&&!S.subs[c]?'sub':'reco');return}
  if(d.del){const c=d.del;S.picks=S.picks.filter(x=>x!==c);delete S.chosen[c];
    if(['reco','sub'].includes(S.scr)){nextStep()}else render();return}
  if(d.up){const i=+d.up;[S.picks[i-1],S.picks[i]]=[S.picks[i],S.picks[i-1]];render();return}
  if(d.entered){S.entered=expEntry()+2+(+d.entered===8?8:0);go('confirm');return}
  if(d.scen){S.scen[d.scen]=!S.scen[d.scen];render();return}
  if(d.jump){const k=d.jump;if(['plan','confirm','alerts','go'].includes(k))ensureDemo();
    if(k==='wait'||k==='plan')S.entered=null;
    if(k==='confirm'&&S.entered==null)S.entered=expEntry()+2;
    go(k);return}
  if(d.reset){Object.assign(S,{scr:'wait',hist:[],picks:[],subs:{},chosen:{},quick:{},page:{},step:0,entered:null,scen:{delay:false,gate:false,late:false}});render();window.scrollTo({top:0});return}
  if(d.go){go(d.go)}
});
render();
</script>
